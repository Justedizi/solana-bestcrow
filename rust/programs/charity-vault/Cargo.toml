[package]
name = "charity-vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "charity_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }

[dev-dependencies]
litesvm = "0.17.0"
solana-address = "2.7"
solana-clock = "3.2"
solana-hash = "4.6"
solana-instruction = "3.5"
solana-keypair = "3.1"
solana-message = "4.2"
solana-signature = "3.5"
solana-signer = "3.0"
solana-transaction = "4.1"
